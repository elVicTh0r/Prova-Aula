<section class="auth-card">
  <span class="etiqueta">INTERCEPTORS · AULA PRÁTICA</span>
  <h1>Entrar na Agenda UniJorge</h1>
  <p>Use uma conta de teste do DummyJSON para visualizar o token no Network.</p>

  <form (ngSubmit)="entrar()">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" [(ngModel)]="usuario" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" [(ngModel)]="senha" autocomplete="current-password" required>

    @if (erro()) {
      <p class="mensagem-erro" role="alert">{{ erro() }}</p>
    }

    <button type="submit" [disabled]="carregando() || !usuario.trim() || !senha">
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <div class="dica">
    <strong>Credenciais de teste</strong>
    <p>Usuário: <code>emilys</code> · Senha: <code>emilyspass</code></p>
  </div>
  <a routerLink="/eventos/novo">Voltar ao cadastro de eventos</a>
</section>
